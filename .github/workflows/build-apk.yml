name: 打包好麦出货系统

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 强制 JavaScript Actions 使用 Node 24，消除弃用警告
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: 下载代码
        uses: actions/checkout@v6

      - name: 安装 Java 17 (打包 APK 必需)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 安装 Flet
        run: pip install flet

      - name: 开始打包 APK (关键修改：加入 -y 参数自动确认)
        # -y 的作用是：遇到任何 "Proceed? [y/n]" 的提示，自动输入 y
        run: flet build apk -y

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: 好麦出货系统-APP
          path: build/apk/**/*.apk
